name: Anthropic AI smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install DataPilot core
        run: pip install .
      - name: Run one semantic call and one contract-draft call against the live API
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-opus-5
          DATAPILOT_AI_MODE: auto
          DATAPILOT_AI_CACHE: 'off'
        run: python scripts/llm_smoke.py
