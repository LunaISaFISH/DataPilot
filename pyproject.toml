[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "datapilot"
version = "0.2.0"
description = "Explainable dataset release gate core and API"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=1.3,<2",
  "fastapi>=0.116,<1",
  "polars>=1.32,<2",
  "pydantic>=2.11,<3",
  "python-multipart>=0.0.20,<1",
  "PyYAML>=6,<7",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
  "types-PyYAML>=6.0,<7",
]

[tool.setuptools]
package-dir = {"" = "services/api"}

[tool.setuptools.packages.find]
where = ["services/api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["datapilot"]
