services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATAPILOT_ALLOWED_ORIGINS: http://localhost:3000
      DATAPILOT_DATA_DIR: /var/lib/datapilot
      # AI configuration is passed through from the host shell; nothing is baked into the image.
      DATAPILOT_AI_MODE: ${DATAPILOT_AI_MODE:-auto}
      DATAPILOT_AI_CACHE: ${DATAPILOT_AI_CACHE:-fallback}
      DATAPILOT_DOCS: ${DATAPILOT_DOCS:-0}
      DATAPILOT_API_TOKEN: ${DATAPILOT_API_TOKEN:-}
      DATAPILOT_PUBLIC_MODE: ${DATAPILOT_PUBLIC_MODE:-0}
      DATAPILOT_UPLOADS_PER_MINUTE: ${DATAPILOT_UPLOADS_PER_MINUTE:-10}
      DATAPILOT_AI_REQUESTS_PER_HOUR: ${DATAPILOT_AI_REQUESTS_PER_HOUR:-20}
      DATAPILOT_AI_DAILY_CALL_CAP: ${DATAPILOT_AI_DAILY_CALL_CAP:-400}
      DATAPILOT_RUN_RETENTION_HOURS: ${DATAPILOT_RUN_RETENTION_HOURS:-24}
      DATAPILOT_SEED_SAMPLES: ${DATAPILOT_SEED_SAMPLES:-0}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
    ports:
      - "8000:8000"
    volumes:
      - datapilot-data:/var/lib/datapilot
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  datapilot-data:
